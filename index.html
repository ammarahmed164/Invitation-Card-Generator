<!DOCTYPE html>
<html lang="en" class="h-full bg-zinc-950 text-zinc-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitation Card Generator</title>
  <meta name="description" content="Invitation Card Generator — create print-ready wedding, engagement, baby shower and soirée invitation cards with a luxury studio workflow.">
  
  <!-- Google Web Fonts (Luxury European Typography Collection) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Cinzel:wght@400;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Great+Vibes&family=Italianno&family=MonteCarlo&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Prata&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN with Custom Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Cormorant Garamond"', 'serif'],
            bodoni: ['"Bodoni Moda"', 'serif'],
            playfair: ['"Playfair Display"', 'serif'],
            cinzel: ['"Cinzel"', 'serif'],
            script: ['"Great Vibes"', 'cursive'],
            pinyon: ['"Pinyon Script"', 'cursive']
          },
          colors: {
            gold: {
              300: '#f3e5ab',
              400: '#e2c785',
              500: '#d4af37',
              600: '#aa771c',
              700: '#80560f'
            },
            olive: {
              400: '#7a8b7b',
              600: '#556b2f',
              800: '#32421c'
            },
            terracotta: '#c05c3d',
            emeraldDark: '#09231b',
            burgundyDark: '#2b0b14'
          }
        }
      }
    }
  </script>

  <!-- Offline & Standalone Vendor Libraries (Local with CDN fallback) -->
  <script src="lib/html2canvas.min.js"></script>
  <script src="lib/jspdf.umd.min.js"></script>
  <script src="lib/confetti.browser.min.js"></script>
  <script src="lib/easy.qrcode.min.js"></script>
  <script>
    if (!window.html2canvas) document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"><\\/script>');
    if (!window.jspdf) document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"><\\/script>');
    if (!window.confetti) document.write('<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"><\\/script>');
    if (!window.QRCode) document.write('<script src="https://cdn.jsdelivr.net/npm/easyqrcodejs@4.5.0/dist/easy.qrcode.min.js"><\\/script>');
  </script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="h-full flex flex-col font-sans overflow-hidden select-none bg-zinc-950 text-zinc-200 mode-lobby">

  <!-- =========================================================================
       STUDIO TOP NAV — Invitation Card Generator
       ========================================================================= -->
  <header id="studio-header" class="studio-header is-hidden">
    <div class="studio-nav-shell">
      <!-- Left: Back + suite context -->
      <div class="studio-nav-brand">
        <button type="button" id="btn-open-catalog" class="studio-collections-btn" title="Back to all collections">
          <svg class="studio-collections-chevron" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
          <span class="studio-collections-grid" aria-hidden="true">
            <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
            </svg>
          </span>
          <span class="studio-collections-label">Collections</span>
        </button>

        <span class="studio-brand-rule" aria-hidden="true"></span>

        <button type="button" id="btn-open-lobby" class="studio-brand-btn" title="Back to this collection">
          <span class="studio-brand-mark" aria-hidden="true">IC</span>
          <span class="studio-brand-copy">
            <span id="header-template-title" class="studio-suite-title">Select a suite</span>
            <span id="header-template-badge" class="studio-suite-badge">Collections</span>
          </span>
        </button>
      </div>

      <!-- Center: Studio tools -->
      <div class="studio-nav-center">
        <div class="studio-tool-rail" role="group" aria-label="Card side">
          <button id="btn-side-front" type="button" class="studio-side-btn is-active">
            <span class="studio-side-label">Front</span>
            <span class="studio-side-sub">Invite</span>
          </button>
          <button id="btn-side-back" type="button" class="studio-side-btn">
            <span class="studio-side-label">Back</span>
            <span class="studio-side-sub">Details</span>
          </button>
        </div>

        <div class="studio-tool-divider" aria-hidden="true"></div>

        <button id="btn-toggle-bleed" type="button" title="Toggle 0.125 inch Bleed Zone Guidelines" class="studio-icon-btn is-on">
          <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
          </svg>
          <span>Bleed</span>
        </button>

        <div class="studio-tool-cluster" role="group" aria-label="History">
          <button id="btn-undo" type="button" title="Undo (Ctrl+Z)" class="studio-icon-btn studio-icon-btn--square">
            <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 10h10a5 5 0 015 5v2a5 5 0 01-5 5H6" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M7 6L3 10l4 4" />
            </svg>
          </button>
          <button id="btn-redo" type="button" title="Redo (Ctrl+Y)" class="studio-icon-btn studio-icon-btn--square">
            <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 10H11a5 5 0 00-5 5v2a5 5 0 005 5h7" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17 6l4 4-4 4" />
            </svg>
          </button>
        </div>

        <div class="studio-zoom-cluster" role="group" aria-label="Zoom">
          <button id="btn-zoom-out" type="button" class="studio-zoom-btn" title="Zoom out">−</button>
          <span id="zoom-display" class="studio-zoom-value">100%</span>
          <button id="btn-zoom-in" type="button" class="studio-zoom-btn" title="Zoom in">+</button>
          <button id="btn-zoom-reset" type="button" class="studio-zoom-reset" title="Reset Zoom">Reset</button>
        </div>
      </div>

      <!-- Right: Actions -->
      <div class="studio-nav-actions">
        <button id="btn-guest-preview" type="button" class="studio-nav-chip">
          <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
          <span class="studio-nav-chip-label">Guest View</span>
        </button>

        <button id="btn-etsy-guide" type="button" title="Paper Stock & Printing Instructions" class="studio-icon-btn studio-icon-btn--square">
          <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
        </button>

        <button id="btn-seller-toolkit" type="button" title="Seller Demo Link & Order Toolkit" class="studio-icon-btn studio-icon-btn--square studio-nav-hide-sm">
          <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </button>

        <button id="btn-share-whatsapp" type="button" class="studio-whatsapp-btn" title="Share invitation to WhatsApp">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.86 9.86 0 0012.04 2zm.01 1.67c2.2 0 4.26.86 5.82 2.42a8.22 8.22 0 012.41 5.83c0 4.54-3.7 8.24-8.24 8.24-1.48 0-2.93-.39-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 01-1.26-4.38c0-4.54 3.7-8.25 8.25-8.25zm4.52 10.52c-.2-.1-1.18-.58-1.36-.64-.18-.07-.32-.1-.45.1-.13.2-.51.64-.63.77-.11.13-.23.15-.43.05-.2-.1-.84-.31-1.6-.99-.59-.53-.99-1.18-1.1-1.38-.12-.2-.01-.3.09-.4.09-.09.2-.23.3-.35.1-.12.13-.2.2-.33.07-.13.03-.25-.02-.35-.05-.1-.45-1.08-.62-1.47-.16-.39-.33-.33-.45-.34h-.38c-.13 0-.35.05-.53.25-.18.2-.7.68-.7 1.65s.72 1.92.82 2.05c.1.13 1.41 2.15 3.42 3.02.48.21.85.33 1.14.42.48.15.91.13 1.26.08.38-.06 1.18-.48 1.34-.95.17-.47.17-.87.12-.95-.05-.08-.18-.13-.38-.23z"/>
          </svg>
          <span class="studio-whatsapp-btn-label">WhatsApp</span>
          <span class="studio-whatsapp-pulse" aria-hidden="true"></span>
        </button>

        <div class="relative">
          <button id="btn-export-dropdown" type="button" class="studio-export-btn">
            <span>Export</span>
            <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>

          <div id="export-menu" class="hidden absolute right-0 mt-2 w-72 rounded-xl bg-zinc-900 border border-zinc-700/80 shadow-2xl py-2 z-50 studio-export-menu">
            <div class="px-3 pt-1.5 pb-2 border-b border-zinc-800 mb-1">
              <span class="text-[10px] font-serif uppercase tracking-widest text-amber-400 font-semibold block">Share first</span>
            </div>

            <button id="btn-export-whatsapp" type="button" class="studio-wa-menu-btn">
              <div class="studio-wa-menu-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.86 9.86 0 0012.04 2zm.01 1.67c2.2 0 4.26.86 5.82 2.42a8.22 8.22 0 012.41 5.83c0 4.54-3.7 8.24-8.24 8.24-1.48 0-2.93-.39-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 01-1.26-4.38c0-4.54 3.7-8.25 8.25-8.25zm4.52 10.52c-.2-.1-1.18-.58-1.36-.64-.18-.07-.32-.1-.45.1-.13.2-.51.64-.63.77-.11.13-.23.15-.43.05-.2-.1-.84-.31-1.6-.99-.59-.53-.99-1.18-1.1-1.38-.12-.2-.01-.3.09-.4.09-.09.2-.23.3-.35.1-.12.13-.2.2-.33.07-.13.03-.25-.02-.35-.05-.1-.45-1.08-.62-1.47-.16-.39-.33-.33-.45-.34h-.38c-.13 0-.35.05-.53.25-.18.2-.7.68-.7 1.65s.72 1.92.82 2.05c.1.13 1.41 2.15 3.42 3.02.48.21.85.33 1.14.42.48.15.91.13 1.26.08.38-.06 1.18-.48 1.34-.95.17-.47.17-.87.12-.95-.05-.08-.18-.13-.38-.23z"/>
                </svg>
              </div>
              <div class="studio-wa-menu-copy">
                <span class="studio-wa-menu-title">Share to WhatsApp</span>
                <span class="studio-wa-menu-sub">Send your invite card in one tap</span>
              </div>
              <span class="studio-wa-menu-badge">Popular</span>
            </button>

            <div class="px-3 py-1.5 border-y border-zinc-800 my-1">
              <span class="text-[10px] font-serif uppercase tracking-widest text-zinc-500 font-semibold block">Also download</span>
            </div>

            <button id="btn-export-pdf" type="button" class="w-full px-3.5 py-2.5 hover:bg-zinc-800 text-left flex items-start gap-2.5 transition">
              <div class="p-1.5 rounded bg-red-950 text-red-400 border border-red-800/60 shrink-0">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 002 2z" />
                </svg>
              </div>
              <div>
                <span class="text-xs font-serif font-bold text-zinc-100 block">Print-Ready PDF (300 DPI)</span>
                <span class="text-[10px] text-zinc-400 block">5" × 7" with 0.125" Bleed & Crop Marks</span>
              </div>
            </button>

            <button id="btn-export-png" type="button" class="w-full px-3.5 py-2.5 hover:bg-zinc-800 text-left flex items-start gap-2.5 transition">
              <div class="p-1.5 rounded bg-amber-950 text-amber-400 border border-amber-800/60 shrink-0">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
              </div>
              <div>
                <span class="text-xs font-serif font-bold text-zinc-100 block">Digital PNG Invite</span>
                <span class="text-[10px] text-zinc-400 block">Crisp graphic for social & stories</span>
              </div>
            </button>

            <button id="btn-export-jpg" type="button" class="w-full px-3.5 py-2.5 hover:bg-zinc-800 text-left flex items-start gap-2.5 transition">
              <div class="p-1.5 rounded bg-blue-950 text-blue-400 border border-blue-800/60 shrink-0">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
              </div>
              <div>
                <span class="text-xs font-serif font-bold text-zinc-100 block">Email JPG Card</span>
                <span class="text-[10px] text-zinc-400 block">Lightweight paperless invite</span>
              </div>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- =========================================================================
       ATELIER LOBBY — Section cards first, then section templates
       ========================================================================= -->
  <div id="atelier-lobby" class="atelier-lobby" aria-label="Invitation Card Generator collections">
    <div class="lobby-atmosphere" aria-hidden="true"></div>
    <div class="lobby-grain" aria-hidden="true"></div>

    <header class="lobby-header">
      <div class="lobby-header-meta lobby-header-meta--left">
        <span class="lobby-pill">Print-Ready Studio</span>
      </div>
      <div class="lobby-header-meta">
        <span id="lobby-suite-count" class="lobby-pill">Curated Suites</span>
      </div>
    </header>

    <div class="lobby-stage">
      <!-- View A: Section Cards -->
      <section id="lobby-view-sections" class="lobby-panel">
        <div class="lobby-hero">
          <div class="brand-masthead">
            <p class="brand-kicker">
              <span class="brand-kicker-line" aria-hidden="true"></span>
              Digital Design Studio
              <span class="brand-kicker-line" aria-hidden="true"></span>
            </p>
            <h1 class="brand-lockup" aria-label="Invitation Card Generator">
              <span class="brand-script">Invitation</span>
              <span class="brand-rule" aria-hidden="true">
                <span class="brand-rule-diamond"></span>
              </span>
              <span class="brand-display">
                <span class="brand-word">Card</span>
                <span class="brand-word brand-word--glow">Generator</span>
              </span>
            </h1>
            <p class="brand-tag">Choose a collection below — open a suite — design in the studio.</p>
          </div>
        </div>
        <div id="lobby-sections-grid" class="lobby-sections-grid">
          <!-- Section cards injected via JS -->
        </div>
      </section>

      <!-- View B: Templates for selected section -->
      <section id="lobby-view-templates" class="lobby-panel hidden">
        <div class="lobby-templates-head">
          <button type="button" id="btn-lobby-back" class="lobby-back-btn">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
            All collections
          </button>
          <div class="lobby-templates-title-wrap">
            <p class="lobby-eyebrow" id="lobby-section-eyebrow">Collection</p>
            <h2 class="lobby-title lobby-title--sm" id="lobby-section-title">Section</h2>
            <p class="lobby-lead" id="lobby-section-tagline"></p>
          </div>
        </div>
        <div id="lobby-templates-grid" class="lobby-templates-grid">
          <!-- Template cards injected via JS -->
        </div>
      </section>
    </div>
  </div>

  <!-- =========================================================================
       MAIN WORKSPACE: Left Sidebar + Canvas Area + Right Inspector
       ========================================================================= -->
  <main id="studio-workspace" class="flex-1 flex overflow-hidden relative studio-workspace is-hidden">

    <div id="studio-drawer-backdrop" class="studio-drawer-backdrop" aria-hidden="true"></div>

    <!-- LEFT PALETTE & DRAWER (Tabs + Dynamic Content) -->
    <aside id="sidebar-left" class="studio-sidebar-left w-80 md:w-96 border-r border-zinc-800 bg-zinc-900/60 flex shrink-0">
      
      <!-- Icon Tab Strip -->
      <div class="studio-tab-rail w-14 border-r border-zinc-800 bg-zinc-950 flex flex-col items-center py-3 gap-3 shrink-0">
        <button class="tab-btn p-2 rounded-lg text-amber-400 bg-zinc-800/80 transition flex flex-col items-center gap-1" data-tab="templates" title="Template Suites">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
          </svg>
          <span class="text-[9px] font-serif">Suites</span>
        </button>

        <button class="tab-btn p-2 rounded-lg text-zinc-400 hover:text-zinc-200 transition flex flex-col items-center gap-1" data-tab="text" title="Typography">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 6h16M4 12h8m-8 6h16" />
          </svg>
          <span class="text-[9px] font-serif">Text</span>
        </button>

        <button class="tab-btn p-2 rounded-lg text-zinc-400 hover:text-zinc-200 transition flex flex-col items-center gap-1" data-tab="elements" title="Art, Wax Seals & Borders">
